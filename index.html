<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WhereIBeen — every flight, every city, one living globe</title>
    <meta
      name="description"
      content="WhereIBeen turns your Gmail flight confirmations and Google Maps Timeline into a premium, animated 3D globe of everywhere you have been."
    />
    <meta name="theme-color" content="#05060d" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhereIBeen" />
    <meta property="og:title" content="WhereIBeen — your travel globe" />
    <meta property="og:description" content="Every flight. Every city. One living globe." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div id="aurora" aria-hidden="true"></div>
    <div id="app" aria-live="polite">
      <div class="boot">
        <div class="boot-orbit"><span></span></div>
        <p>Preparing your globe…</p>
      </div>
    </div>
    <div id="globe-host" aria-hidden="true"></div>
    <div id="modal-root"></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="wipe" aria-hidden="true"></div>
    <div id="cursor" aria-hidden="true"><span class="cursor-dot"></span><span class="cursor-ring"></span></div>
    <noscript>
      <p style="padding: 2rem; color: #fff; font-family: sans-serif">WhereIBeen needs JavaScript to draw your globe.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
