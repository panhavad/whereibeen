# Production deployment: runs the image published by GitHub Actions and keeps it
# up to date automatically. Every push to main → CI builds & pushes a new image →
# Watchtower notices within WATCHTOWER_POLL_INTERVAL seconds and restarts the app.
#
#   cp .env.example .env   # set GOOGLE_CLIENT_ID and WHEREIBEEN_IMAGE
#   docker compose up -d
name: whereibeen

services:
  web:
    image: ${WHEREIBEEN_IMAGE:-ghcr.io/your-github-user/whereibeen:latest}
    container_name: whereibeen
    restart: unless-stopped
    ports:
      - "${WHEREIBEEN_PORT:-8080}:8080"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    labels:
      # Only containers with this label are touched by Watchtower.
      com.centurylinklabs.watchtower.enable: "true"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  watchtower:
    # Maintained fork of containrrr/watchtower (archived; incompatible with Docker 29+).
    image: nickfedor/watchtower:latest
    container_name: whereibeen-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Private registry? Run `docker login ghcr.io` on the host and uncomment:
      # - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-60}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      TZ: ${TZ:-UTC}
